[package]
name = "evm-report"
description = "Builds test cases for the evm-bounty check: synthetic state with mainnet-depth proofs, toy contracts, and the check arguments for each phase"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
evm-bounty-check = { path = "../../check" }
witness-types = { workspace = true, features = ["std"] }
revm = { version = "43.0.3", default-features = false, features = ["std"] }
alloy-trie = { version = "0.9.8" }
alloy-rlp = { version = "0.3" }
ureq = { version = "2.12", features = ["json", "native-certs"] }
serde_json = "1"
